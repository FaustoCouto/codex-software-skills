schema_version: 1
projects:
  - project_id: "open-delivery-api"
    display_name: "Open Delivery API"
    path: "open-delivery-api"
    kind: "api"
    git_remote: "https://github.com/FaustoCouto/open-delivery-api.git"
    issue_tracker: "https://github.com/FaustoCouto/open-delivery-api/issues"
    validation_commands:
      - "npm run lint"
      - "npm run format:check"
      - "npm test"
      - "npm run build"
    workflow_files:
      role_skills:
        manage_issue: "../plugins/codex-software-skills/skills/manage-issue/SKILL.md"
        qa_issue: "../plugins/codex-software-skills/skills/qa-issue/SKILL.md"
        discover_work: "../plugins/codex-software-skills/skills/discover-work/SKILL.md"
        run_harness: "../plugins/codex-software-skills/skills/run-harness/SKILL.md"
        implement_issue: "../plugins/codex-software-skills/skills/implement-issue/SKILL.md"
  - project_id: "open-delivery-front"
    display_name: "Open Delivery Front"
    path: "open-delivery-front"
    kind: "frontend"
    status: "directory-only"
    git_remote: null
    issue_tracker: null
    validation_commands: []
